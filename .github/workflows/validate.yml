name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Lint YAML
        run: yamllint -c .yamllint.yml .

      - name: Validate repository safety policy
        run: python tools/check_repository_policy.py

      - name: Scan reachable Git history for secrets
        run: python tools/check_git_history_secrets.py

      - name: Compile repository tooling
        run: python -m compileall -q tools
