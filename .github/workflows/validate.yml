name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Lint YAML
        run: yamllint -c .yamllint.yml .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate repository safety policy
        run: python tools/check_repository_policy.py

      - name: Scan reachable Git history for secrets
        run: python tools/check_git_history_secrets.py

      - name: Compile repository tooling
        run: python -m compileall -q tools tests

      - name: Build isolated public Home Assistant fixture
        run: python tools/build_public_validation_fixture.py --output "$RUNNER_TEMP/ha-public-config"

      - name: Validate with exact production Home Assistant version
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(python tools/build_public_validation_fixture.py --print-version)"
          image="ghcr.io/home-assistant/home-assistant:${version}"
          docker pull "$image"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
          printf 'home_assistant_image=%s\n' "$digest"
          docker run --rm \
            -v "$RUNNER_TEMP/ha-public-config:/config" \
            "$image" \
            python -m homeassistant --script check_config \
              --config /config \
              --fail-on-warnings
