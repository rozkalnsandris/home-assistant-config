name: Workflow security

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "renovate.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-security:
    name: GitHub Actions static analysis
    uses: rozkalnsandris/ops-workflows/.github/workflows/workflow-security.yml@f4b946176d1bc4aae23adc928c78ba4bdbbb68ec
    permissions:
      contents: read
