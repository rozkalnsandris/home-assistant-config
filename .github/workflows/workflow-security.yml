name: Workflow security

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "renovate.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-security:
    name: GitHub Actions static analysis
    uses: rozkalnsandris/ops-workflows/.github/workflows/workflow-security.yml@297f554519849ab8dcaadc5517e60b8269a6efaa
    permissions:
      contents: read
