name: Workflow security

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "renovate.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-security:
    name: GitHub Actions static analysis
    uses: rozkalnsandris/ops-workflows/.github/workflows/workflow-security.yml@4e89b75d7f496dfb43fd9c1eb10a995fad53fdd8
    permissions:
      contents: read
