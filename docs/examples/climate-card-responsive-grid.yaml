# Public-safe layout-only fragment for a compact custom:button-card climate tile.
# This is NOT a complete Lovelace dashboard or an export of private configuration.
#
# Inside the PRIVATE button_card_templates.climate_card.styles mapping:
#   * replace existing styles.grid layout properties with the grid below;
#   * add min-width, overflow and truncation to existing styles.name;
#   * change existing custom_fields.t grid-row from "1 / 3" to "1";
#   * retain all other current card, template and nested custom-field styles.
#
# Grid row 1: room icon | name | target temperature | heating control
# Grid row 2: room icon | sensor readings + window indicator | heating control
# x spans both middle columns only in row 2, avoiding collision with t.
#
# Do not modify real entities, device targets, HVAC actions or popup behavior.
# Private changes and visual validation require separate production authorization.
styles:
  grid:
    - grid-template-areas: '"i n t f" "i x x f"'
    - grid-template-columns: "56px minmax(0, 1fr) auto 50px"
    - grid-template-rows: "1fr 1fr"
    - column-gap: 8px
    - row-gap: 2px
  name:
    - grid-area: n
    - min-width: 0
    - overflow: hidden
    - text-overflow: ellipsis
    - white-space: nowrap
  custom_fields:
    x:
      - grid-area: x
      - min-width: 0
      - justify-self: start
      - align-self: start
    t:
      - grid-area: t
      - grid-row: "1"
      - justify-self: end
      - align-self: center
      - padding-right: 4px
    f:
      - grid-area: f
      - grid-row: "1 / 3"
      - justify-self: end
      - align-self: center
